<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#08182b" />
    </linearGradient>

    <!-- Radial Soft Glow -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="32" stroke="#1e3a5f" stroke-width="2" fill="none" />

  <!-- Brand Pill -->
  <g transform="translate(600, 105)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#e0f2fe" text-anchor="middle">
      🩺 শিশুদের ইন্টারঅ্যাক্টিভ বিজ্ঞান পাঠশালা
    </text>
  </g>

  <!-- Big Brand Title: KhudeDoctor (খুদে ডাক্তার) -->
  <text x="600" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    খুদে ডাক্তার
  </text>

  <!-- English Brand Subtitle -->
  <text x="600" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="2">
    KHUDEDOCTOR • মানবদেহের জাদুকরী পাঠশালা
  </text>

  <!-- Tagline -->
  <text x="600" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" text-anchor="middle">
    এসো নিজের শরীরকে জানি • বাংলা ভয়েস বিবরণ • ১৬টি প্রধান অঙ্গ • মজার কুইজ মিশন
  </text>

  <!-- 4 Organ Showcase Badges -->
  <g transform="translate(240, 375)" filter="url(#shadow)">
    
    <!-- Heart Card -->
    <g transform="translate(0, 0)">
      <rect width="160" height="125" rx="22" fill="#13273e" stroke="#ef4444" stroke-width="2.5" />
      <circle cx="80" cy="46" r="26" fill="#ef4444" fill-opacity="0.25" />
      <text x="80" y="56" font-size="30" text-anchor="middle">🫀</text>
      <text x="80" y="100" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#f87171" text-anchor="middle">হৃৎপিণ্ড</text>
    </g>

    <!-- Brain Card -->
    <g transform="translate(186, 0)">
      <rect width="160" height="125" rx="22" fill="#13273e" stroke="#8b5cf6" stroke-width="2.5" />
      <circle cx="80" cy="46" r="26" fill="#8b5cf6" fill-opacity="0.25" />
      <text x="80" y="56" font-size="30" text-anchor="middle">🧠</text>
      <text x="80" y="100" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#a78bfa" text-anchor="middle">মস্তিষ্ক</text>
    </g>

    <!-- Lungs Card -->
    <g transform="translate(372, 0)">
      <rect width="160" height="125" rx="22" fill="#13273e" stroke="#06b6d4" stroke-width="2.5" />
      <circle cx="80" cy="46" r="26" fill="#06b6d4" fill-opacity="0.25" />
      <text x="80" y="56" font-size="30" text-anchor="middle">🫁</text>
      <text x="80" y="100" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#22d3ee" text-anchor="middle">ফুসফুস</text>
    </g>

    <!-- Movement Card -->
    <g transform="translate(558, 0)">
      <rect width="160" height="125" rx="22" fill="#13273e" stroke="#10b981" stroke-width="2.5" />
      <circle cx="80" cy="46" r="26" fill="#10b981" fill-opacity="0.25" />
      <text x="80" y="56" font-size="30" text-anchor="middle">🦴</text>
      <text x="80" y="100" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#34d399" text-anchor="middle">কঙ্কাল ও হাড়</text>
    </g>
  </g>

  <!-- Bottom Details -->
  <text x="600" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle">
    খুদে বিজ্ঞানীদের জন্য ইন্টারেক্টিভ লার্নিং • শরীরের প্রতিটি সৃষ্টিতে বলো আলহামদুলিল্লাহ!
  </text>
</svg>
