<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Doctor Gradient -->
    <linearGradient id="doctorBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="crossRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Rounded Squircle -->
  <rect width="100" height="100" rx="26" fill="url(#doctorBlue)" />
  
  <!-- Subtle inner border -->
  <rect x="2.5" y="2.5" width="95" height="95" rx="23.5" stroke="white" stroke-opacity="0.25" stroke-width="2.5" />

  <!-- Doctor Coat / Stethoscope + Medical Emblem Motif -->
  <g filter="url(#badgeShadow)">
    <!-- White Circular Badge -->
    <circle cx="50" cy="50" r="33" fill="white" />

    <!-- Cute Red Medical Cross -->
    <path 
      d="M45 28 H55 V44 H71 V54 H55 V70 H45 V54 H29 V44 H45 Z" 
      fill="url(#crossRed)" 
      rx="3"
    />

    <!-- Stethoscope Loop Surrounding Bottom -->
    <path 
      d="M32 45 C32 62, 68 62, 68 45" 
      stroke="#0284c7" 
      stroke-width="4" 
      stroke-linecap="round" 
      fill="none" 
    />
    <circle cx="50" cy="62" r="4.5" fill="#0284c7" />
    <circle cx="50" cy="62" r="2.5" fill="#38bdf8" />
  </g>
</svg>
